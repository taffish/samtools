[package]
name = "samtools"
kind = "tool"
version = "1.25"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/samtools"

[command]
name = "taf-samtools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/samtools:1.25-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genomics", "alignment", "sam-bam-cram"]
keywords = ["sam", "bam", "cram", "alignment", "htslib", "bgzip", "tabix", "ngs"]
description = "Toolkit for reading, writing, editing, indexing, viewing, and summarizing SAM/BAM/CRAM alignment files."

[upstream]
name = "SAMtools"
type = "github"
repo = "samtools/samtools"
homepage = "https://www.htslib.org/"
release_url = "https://github.com/samtools/samtools/releases/tag/1.25"
downloads = "https://github.com/samtools/samtools/releases/download/1.25/samtools-1.25.tar.bz2; https://github.com/samtools/htslib/releases/download/1.25/htslib-1.25.tar.bz2"
version = "1.25"
license = "MIT/Expat"
citation = "Danecek et al. 2021"
doi = "10.1093/gigascience/giab008"
pmid = "33590861"
watch = "tags"

[smoke]
backend = "docker"
timeout = 120
exist = ["samtools", "bgzip", "tabix", "htsfile", "annot-tsv", "ref-cache", "ace2sam", "maq2sam-long", "maq2sam-short", "md5fa", "md5sum-lite", "wgsim", "blast2sam.pl", "bowtie2sam.pl", "export2sam.pl", "fasta-sanitize.pl", "interpolate_sam.pl", "novo2sam.pl", "plot-ampliconstats", "plot-bamstats", "psl2sam.pl", "sam2vcf.pl", "samtools.pl", "seq_cache_populate.pl", "seq_cache_populate.py", "soap2sam.pl", "wgsim_eval.pl", "zoom2sam.pl", "gnuplot", "convert", "python3", "perl", "gzip", "gunzip"]
test = ["sh /opt/samtools/share/taffish/smoke.sh identity", "sh /opt/samtools/share/taffish/smoke.sh help", "sh /opt/samtools/share/taffish/smoke.sh core", "sh /opt/samtools/share/taffish/smoke.sh delta", "sh /opt/samtools/share/taffish/smoke.sh htslib", "sh /opt/samtools/share/taffish/smoke.sh plot", "sh /opt/samtools/share/taffish/smoke.sh amplicon", "sh /opt/samtools/share/taffish/smoke.sh refcache", "sh /opt/samtools/share/taffish/smoke.sh wgsim", "sh /opt/samtools/share/taffish/smoke.sh extras"]
