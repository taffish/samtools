[package]
name = "samtools"
kind = "tool"
version = "1.24"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/samtools"

[command]
name = "taf-samtools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/samtools:1.24-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genomics", "alignment", "sam-bam-cram"]
keywords = ["sam", "bam", "cram", "alignment", "htslib", "bgzip", "tabix", "ngs"]
description = "Toolkit for reading, writing, editing, indexing, viewing, and summarizing SAM/BAM/CRAM alignment files."

[upstream]
name = "SAMtools"
type = "github"
repo = "samtools/samtools"
homepage = "https://www.htslib.org/"
release_url = "https://github.com/samtools/samtools/releases/tag/1.24"
downloads = "https://github.com/samtools/samtools/releases/download/1.24/samtools-1.24.tar.bz2; https://github.com/samtools/htslib/releases/download/1.24/htslib-1.24.tar.bz2"
version = "1.24"
license = "MIT/Expat"
citation = "Danecek et al. 2021"
doi = "10.1093/gigascience/giab008"
pmid = "33590861"
watch = "tags"

[smoke]
backend = "docker"
timeout = 120
exist = ["samtools", "bgzip", "tabix", "htsfile", "annot-tsv", "ref-cache", "ace2sam", "maq2sam-long", "maq2sam-short", "md5fa", "md5sum-lite", "wgsim", "blast2sam.pl", "bowtie2sam.pl", "export2sam.pl", "fasta-sanitize.pl", "interpolate_sam.pl", "novo2sam.pl", "plot-ampliconstats", "plot-bamstats", "psl2sam.pl", "sam2vcf.pl", "samtools.pl", "seq_cache_populate.pl", "seq_cache_populate.py", "soap2sam.pl", "wgsim_eval.pl", "zoom2sam.pl", "gnuplot", "convert", "python3", "perl", "gzip", "gunzip"]
test = ["samtools --help 2>&1 | grep -F 'Program: samtools' >/dev/null && samtools --version 2>&1 | grep -Fx 'samtools 1.24' >/dev/null && samtools --version 2>&1 | grep -Fx 'Using htslib 1.24' >/dev/null", "samtools view --help 2>&1 | grep -F 'Usage: samtools view' >/dev/null && samtools sort --help 2>&1 | grep -F 'Usage: samtools sort' >/dev/null && samtools quickcheck --help 2>&1 | grep -F 'Usage: samtools quickcheck' >/dev/null && samtools tview --help 2>&1 | grep -F 'Usage: samtools tview' >/dev/null", "samtools markdup --help 2>&1 | grep -F -- '--move-umi-to-tag' >/dev/null && samtools stats --help 2>&1 | grep -F -- '--customized-index' >/dev/null", "work=/tmp/taf-samtools-core; mkdir -p $work; printf '@HD\\tVN:1.6\\tSO:unsorted\\n@SQ\\tSN:chr1\\tLN:100\\nr1\\t0\\tchr1\\t1\\t60\\t10M\\t*\\t0\\t0\\tAAAAAAAAAA\\tFFFFFFFFFF\\nr2\\t0\\tchr1\\t21\\t60\\t10M\\t*\\t0\\t0\\tACGTACGTAC\\tFFFFFFFFFF\\nr3\\t0\\tchr1\\t41\\t60\\t10M\\t*\\t0\\t0\\tGCGCGCGCGC\\tFFFFFFFFFF\\n' > $work/in.sam; samtools view -b -o $work/in.bam $work/in.sam; samtools sort -o $work/sorted.bam $work/in.bam; samtools index $work/sorted.bam; samtools quickcheck $work/sorted.bam; test \"$(samtools view -c $work/sorted.bam)\" -eq 3; samtools flagstat $work/sorted.bam | grep -F '3 + 0 in total' >/dev/null; samtools stats $work/sorted.bam | grep -F 'raw total sequences:' >/dev/null; samtools idxstats $work/sorted.bam | grep -F 'chr1' >/dev/null", "work=/tmp/taf-samtools-htslib; mkdir -p $work; printf 'chr1\\t0\\t10\\tgeneA\\nchr1\\t20\\t30\\tgeneB\\n' > $work/regions.bed; bgzip -c $work/regions.bed > $work/regions.bed.gz; tabix -p bed $work/regions.bed.gz; tabix $work/regions.bed.gz chr1:1-10 | grep -F 'geneA' >/dev/null; htsfile $work/regions.bed.gz | grep -iF 'BED' >/dev/null; printf 'chr1\\t1\\t10\\tgeneA\\n' > $work/source.tsv; printf 'chr1\\t5\\t5\\t.\\n' > $work/target.tsv; annot-tsv -s $work/source.tsv -t $work/target.tsv -c 1,2,3:1,2,3 -f 4:4 | grep -F 'geneA' >/dev/null", "work=/tmp/taf-samtools-plot; mkdir -p $work/plots; printf '@HD\\tVN:1.6\\tSO:unsorted\\n@SQ\\tSN:chr1\\tLN:100\\nr1\\t0\\tchr1\\t1\\t60\\t10M\\t*\\t0\\t0\\tAAAAAAAAAA\\tFFFFFFFFFF\\nr2\\t0\\tchr1\\t21\\t60\\t10M\\t*\\t0\\t0\\tACGTACGTAC\\tFFFFFFFFFF\\nr3\\t0\\tchr1\\t41\\t60\\t10M\\t*\\t0\\t0\\tGCGCGCGCGC\\tFFFFFFFFFF\\n' > $work/in.sam; samtools view -b -o $work/in.bam $work/in.sam; samtools sort -o $work/sorted.bam $work/in.bam; samtools stats $work/sorted.bam > $work/stats.txt; plot-bamstats -p $work/plots/ $work/stats.txt; find $work/plots -type f -name '*.png' -size +0c | grep -q .; convert $work/plots/gc-content.png -scale 50% $work/thumbnail.png; test -s $work/thumbnail.png", "work=/tmp/taf-samtools-refcache; mkdir -p $work; printf '>chr1\\nACGTACGTACGT\\n' > $work/ref.fa; seq_cache_populate.py -root $work/cache $work/ref.fa; find $work/cache -type f -size +0c | grep -q .", "work=/tmp/taf-samtools-wgsim; mkdir -p $work; printf '>chr1\\n' > $work/ref.fa; head -c 1000 /dev/zero | tr '\\000' A >> $work/ref.fa; printf '\\n' >> $work/ref.fa; wgsim -N 2 -1 20 -2 20 -d 100 -s 10 -e 0 -r 0 -R 0 -X 0 $work/ref.fa $work/read1.fq $work/read2.fq; test \"$(wc -l < $work/read1.fq)\" -eq 8; test \"$(wc -l < $work/read2.fq)\" -eq 8", "printf '>chr,1\\nACGT\\n' | fasta-sanitize.pl | grep -Fx '>chr_1' >/dev/null && samtools.pl 2>&1 | grep -F 'Program: samtools.pl' >/dev/null", "annot-tsv --help 2>&1 | grep -Fx 'Version: 1.24' >/dev/null && ref-cache 2>&1 | grep -F 'ref-cache [options]' >/dev/null && plot-bamstats -h 2>&1 | grep -F 'Usage: plot-bamstats' >/dev/null && plot-ampliconstats -help 2>&1 | grep -F 'Usage: plot-ampliconstats' >/dev/null && seq_cache_populate.py --help 2>&1 | grep -F 'Directory to create the refcache dir' >/dev/null", "perl -MURI::Escape -e 'print uri_escape(qq(ok))' | grep -Fx ok >/dev/null && gnuplot --version >/dev/null && convert -version 2>&1 | grep -F ImageMagick >/dev/null && printf 'ok\\n' | gzip -c | gunzip -c | grep -Fx ok >/dev/null", "test -s /opt/samtools/share/licenses/samtools/LICENSE && test -s /opt/samtools/share/licenses/htslib/LICENSE"]
