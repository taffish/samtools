[package]
name = "samtools"
kind = "tool"
version = "1.23.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/samtools"

[command]
name = "taf-samtools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/samtools:1.23.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
type = "github"
repo = "samtools/samtools"
watch = "tags"

[smoke]
backend = "docker"
timeout = 60
exist = ["samtools", "bgzip", "tabix", "htsfile", "plot-bamstats", "plot-ampliconstats", "gnuplot", "perl"]
test = ["samtools --help", "samtools --version 2>&1 | grep -F 'samtools 1.23.1' >/dev/null", "samtools --version 2>&1 | grep -F 'Using htslib 1.23.1' >/dev/null", "samtools view --help 2>&1 | grep -F 'Usage: samtools view' >/dev/null", "samtools sort --help 2>&1 | grep -F 'Usage: samtools sort' >/dev/null", "samtools quickcheck --help 2>&1 | grep -F 'Usage: samtools quickcheck' >/dev/null", "samtools tview --help 2>&1 | grep -F 'Usage: samtools tview' >/dev/null", "bgzip --help >/dev/null", "tabix --help >/dev/null", "htsfile --help >/dev/null", "gnuplot --version >/dev/null", "plot-bamstats -h 2>&1 | grep -F 'Usage: plot-bamstats' >/dev/null", "plot-ampliconstats -help 2>&1 | grep -F 'Usage: plot-ampliconstats' >/dev/null", "perl -MURI::Escape -e 'print uri_escape(qq(ok))' >/dev/null"]
